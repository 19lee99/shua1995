<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>如果那天你上了飛機 · 互動問答遊戲</title>
<meta name="description" content="五個選擇，一段練習生到出道的旅程。有夢想沒夢想，你們都是完整的人。">
<meta name="theme-color" content="#0a0d2e">
<style>
:root{
  /* ───────── 外觀設定：改這一區就能換整體配色 ───────── */
  --bg:#262c86;            /* 遊戲背景（藍紫） */
  --bg-deep:#171b5c;       /* 背景暗部 / 陰影 */
  --panel:#ffffff;         /* 題目面板 */
  --panel-shadow:#b4bbe8;  /* 面板下方立體陰影 */
  --ink:#1a1f4d;          /* 面板上的文字 */
  --gold:#ffc940;          /* 強調色（開始、繼續、選中） */
  --gold-deep:#d39a00;     /* 強調色的立體陰影 */
  --gold-ink:#3b2a00;      /* 強調色上的文字 */
  --rail:rgba(255,255,255,.38);
  --fade:420ms;            /* 淡入淡出時間 */
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:#0a0d2e;
  display:grid;place-items:center;
  min-height:100vh;min-height:100dvh;
  overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none !important}

/* ───────── 9:16 直式畫面（所有尺寸以畫面寬度 cqw 為單位，縮放不走樣） ───────── */
.frame{
  position:relative;
  width:min(100vw,calc(100vh*9/16));
  width:min(100vw,calc(100dvh*9/16));
  aspect-ratio:9/16;
  container-type:size;
  overflow:hidden;
  isolation:isolate;
  color:#fff;
  background:radial-gradient(90% 55% at 50% 0%,#3c43c2 0%,var(--bg) 62%,var(--bg-deep) 100%);
}
@media (min-aspect-ratio:5/8){
  .frame{border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
}
/* 節目舞台的放射光束 */
.frame::before{
  content:"";position:absolute;inset:-30%;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,255,255,.06) 0 7.5deg,transparent 7.5deg 15deg);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 68%);
  mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 68%);
}

/* ───────── 上方進度（HUD）：第 N / 5 題＋飛行航線 ───────── */
.trip{
  position:absolute;left:0;right:0;top:0;z-index:4;
  height:19cqw;padding:5cqw 7cqw 0;
  opacity:0;transition:opacity var(--fade) ease;
  pointer-events:none;
}
.trip.show{opacity:1}
.trip-label{
  font-size:4.2cqw;font-weight:800;margin-bottom:1.4cqw;
  font-variant-numeric:tabular-nums;
  text-shadow:0 .3cqw 1cqw rgba(0,0,0,.4);
}
.track{position:relative;height:8cqw;margin:0 4cqw}
.rail{position:absolute;left:0;right:0;top:calc(50% - .3cqw);border-top:.6cqw dashed var(--rail)}
.rail-done{
  position:absolute;left:0;top:calc(50% - .35cqw);
  height:.7cqw;width:0;border-radius:1cqw;background:var(--gold);
  transition:width .9s cubic-bezier(.5,0,.2,1);
}
.stop{
  position:absolute;top:50%;
  width:2.8cqw;height:2.8cqw;border-radius:50%;
  background:var(--bg);border:.6cqw solid var(--rail);
  transform:translate(-50%,-50%);
  transition:background .4s ease,border-color .4s ease;
}
.stop.reached{background:var(--gold);border-color:var(--gold)}
.plane{
  position:absolute;top:50%;left:0;
  width:8cqw;height:8cqw;border-radius:50%;
  display:grid;place-items:center;
  background:var(--bg-deep);color:var(--gold);
  box-shadow:0 0 0 .5cqw rgba(255,255,255,.22);
  transform:translate(-50%,-50%);
  transition:left .9s cubic-bezier(.5,0,.2,1);
}
.plane svg{width:5cqw;height:5cqw;fill:currentColor;transform:rotate(90deg)}

/* ───────── 畫面切換（淡入淡出） ───────── */
.stages{
  position:absolute;inset:0;z-index:3;
  display:flex;flex-direction:column;
  padding:21cqw 7cqw 7cqw;
  pointer-events:none;
}
.stages button{pointer-events:auto}
.stage{
  flex:1;min-height:0;
  display:none;flex-direction:column;
  opacity:0;transition:opacity var(--fade) ease;
}
.stage.active{display:flex}
.stage.visible{opacity:1}
[tabindex="-1"]:focus{outline:none}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6cqw}
.actions{display:grid;gap:4cqw;padding-top:4cqw}

/* ───────── 開始畫面 ───────── */
.emblem{
  align-self:center;
  width:24cqw;height:24cqw;border-radius:50%;
  display:grid;place-items:center;
  background:var(--gold);color:var(--gold-ink);
  box-shadow:0 1.6cqw 0 var(--gold-deep);
}
.emblem svg{width:13cqw;height:13cqw;fill:currentColor;transform:rotate(45deg)}
.title{
  font-size:13cqw;font-weight:900;line-height:1.2;letter-spacing:-.01em;
  text-align:center;white-space:pre-line;
  text-shadow:0 .9cqw 0 var(--bg-deep),0 1.8cqw 2.6cqw rgba(0,0,0,.35);
}
.lede{font-size:4.6cqw;line-height:1.7;text-align:center;color:rgba(255,255,255,.85)}

/* ───────── 題目面板（知識王式：大面板＋大按鈕） ───────── */
.panel{
  position:relative;margin-top:5cqw;
  background:var(--panel);color:var(--ink);
  border-radius:6cqw;
  box-shadow:0 1.6cqw 0 var(--panel-shadow);
  padding:10cqw 6.5cqw 8cqw;
}
.q-badge{
  position:absolute;left:50%;top:0;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  padding:1.3cqw 5.5cqw;border-radius:999px;
  background:var(--gold);color:var(--gold-ink);
  box-shadow:0 .9cqw 0 var(--gold-deep);
  font-size:4.6cqw;font-weight:900;
}
.q-badge.big{font-size:6cqw;padding:1.8cqw 8cqw}
.question{
  font-size:6.6cqw;font-weight:900;line-height:1.55;
  text-align:center;text-wrap:balance;
}
.story-text{
  font-size:5.3cqw;font-weight:600;line-height:1.85;
  text-wrap:pretty;
}
.story-body[data-choice="no"] .q-badge{background:var(--ink);color:#fff;box-shadow:0 .9cqw 0 #000}
.ending{
  font-size:7.4cqw;font-weight:900;line-height:1.55;
  text-align:center;white-space:pre-line;text-wrap:balance;
}

/* ───────── 按鈕（立體、好按） ───────── */
.btn{
  appearance:none;-webkit-appearance:none;
  width:100%;min-height:17cqw;padding:0 6cqw;
  border:0;border-radius:5cqw;
  font:inherit;font-size:6cqw;font-weight:900;letter-spacing:.02em;
  cursor:pointer;touch-action:manipulation;
  box-shadow:0 1.4cqw 0 var(--btn-shadow);
  transition:transform .08s ease,box-shadow .08s ease,background .2s ease,color .2s ease,opacity .25s ease;
}
.btn:active{transform:translateY(1cqw);box-shadow:0 .4cqw 0 var(--btn-shadow)}
.btn:focus-visible{outline:.8cqw solid #fff;outline-offset:1cqw}
.btn-gold{background:var(--gold);color:var(--gold-ink);--btn-shadow:var(--gold-deep)}
.btn-white{background:#fff;color:var(--ink);--btn-shadow:var(--panel-shadow)}
.btn-big{min-height:22cqw;font-size:8.4cqw;border-radius:7cqw}
.btn-glass{
  min-height:14cqw;font-size:4.8cqw;
  background:rgba(255,255,255,.2);color:#fff;--btn-shadow:rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.answers{gap:4.5cqw}
.answers .btn{min-height:19cqw;font-size:7cqw}
.answers.picked .btn{opacity:.4}
.answers.picked .btn.is-picked{opacity:1;background:var(--gold);color:var(--gold-ink);--btn-shadow:var(--gold-deep)}
@media (hover:hover){.btn-white:hover{background:#f1f3ff}}

/* ───────── 影片：整個 9:16 畫面滿版，看不到 YouTube 介面 ───────── */
.video-layer{
  position:absolute;inset:0;z-index:1;
  background:#000;overflow:hidden;
  opacity:0;transition:opacity var(--fade) ease;
  pointer-events:none;
}
.frame.mode-video .video-layer{opacity:1}
/* iframe 上下各多出一段再被裁掉 → YouTube 的標題列與控制列落在畫面外；9:16 影片本身不會被裁到 */
#yt{position:absolute;left:0;top:-11%;width:100%;height:122%;border:0;pointer-events:none}
.scrim{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(8,10,36,.6) 0,transparent 24%,transparent 70%,rgba(8,10,36,.65) 100%);
}
.video-bar{position:absolute;left:0;bottom:0;height:1.1cqw;width:0;background:var(--gold);transition:width .2s linear}
.video-layer[data-loading="true"]::after{
  content:"";position:absolute;left:50%;top:50%;
  width:10cqw;height:10cqw;margin:-5cqw 0 0 -5cqw;
  border:1cqw solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#stage-video{pointer-events:none}

/* 蓋在影片上：擋住誤觸暫停，並放「播放／開聲音／錯誤訊息」 */
.shield{
  position:absolute;inset:0;z-index:2;
  display:grid;place-items:center;padding:8cqw;text-align:center;
  pointer-events:none;
}
.frame.mode-video .shield{pointer-events:auto}
.shield>*{display:none}
.shield[data-mode="play"] .play-btn{display:grid}
.shield[data-mode="unmute"] .unmute-btn{display:inline-flex}
.shield[data-mode="msg"] .video-msg{display:block}
.play-btn{
  width:24cqw;height:24cqw;border-radius:50%;border:0;cursor:pointer;
  place-items:center;background:var(--gold);color:var(--gold-ink);
  box-shadow:0 1.4cqw 0 var(--gold-deep);touch-action:manipulation;
}
.play-btn svg{width:10cqw;height:10cqw;fill:currentColor;margin-left:1.2cqw}
.unmute-btn{
  position:absolute;left:7cqw;top:22cqw;
  align-items:center;min-height:11cqw;padding:0 5cqw;
  border:0;border-radius:999px;cursor:pointer;
  background:rgba(255,255,255,.94);color:var(--ink);
  font:inherit;font-size:4.2cqw;font-weight:800;touch-action:manipulation;
}
.video-msg{
  font-size:4.6cqw;line-height:1.7;
  background:rgba(8,10,36,.78);padding:5cqw 6cqw;border-radius:5cqw;
}
.play-btn:focus-visible,.unmute-btn:focus-visible{outline:.8cqw solid #fff;outline-offset:1cqw}

@media (prefers-reduced-motion:reduce){
  :root{--fade:1ms}
  .plane,.rail-done,.stop,.btn,.video-bar{transition:none}
  .video-layer[data-loading="true"]::after{animation-duration:2.4s}
}
</style>
</head>
<body>
<div class="frame" id="frame">

  <!-- 影片層：整個畫面滿版播放 -->
  <div class="video-layer" id="videoLayer" data-loading="true">
    <div id="yt"></div>
    <div class="scrim"></div>
    <div class="video-bar" id="videoBar"></div>
  </div>

  <!-- 蓋在影片上：擋住 YouTube 的點擊，並放播放／開聲音／訊息 -->
  <div class="shield" id="shield" data-mode="none">
    <button class="play-btn" id="playBtn" type="button" aria-label="播放影片">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="unmute-btn" id="unmuteBtn" type="button">點一下開啟聲音</button>
    <p class="video-msg" id="videoMsg"></p>
  </div>

  <!-- 進度：第 N / 5 題（飛機沿航線前進） -->
  <header class="trip" id="trip">
    <p class="trip-label" id="tripLabel" aria-live="polite">第 1 / 5 題</p>
    <div class="track" id="track" role="progressbar" aria-label="題目進度" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
      <div class="rail"></div>
      <div class="rail-done" id="railDone"></div>
      <div class="plane" id="plane">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      </div>
    </div>
  </header>

  <main class="stages">

    <!-- 開始 -->
    <section class="stage" id="stage-start">
      <div class="body">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
        </div>
        <h1 class="title" id="startTitle" tabindex="-1"></h1>
        <p class="lede" id="startLede"></p>
      </div>
      <div class="actions">
        <button class="btn btn-gold btn-big" id="btnStart" type="button">開始</button>
      </div>
    </section>

    <!-- 影片（畫面本體在最底下的影片層，這裡只放按鈕） -->
    <section class="stage" id="stage-video" aria-label="情境影片">
      <div class="body"></div>
      <div class="actions">
        <button class="btn btn-glass" id="btnSkip" type="button">略過影片</button>
      </div>
    </section>

    <!-- 問題 -->
    <section class="stage" id="stage-question">
      <div class="body">
        <div class="panel">
          <span class="q-badge" id="qBadge">Q1</span>
          <h2 class="question" id="qText" tabindex="-1"></h2>
        </div>
      </div>
      <div class="actions answers" id="answers">
        <button class="btn btn-white" id="btnYes" type="button">Yes</button>
        <button class="btn btn-white" id="btnNo" type="button">No</button>
      </div>
    </section>

    <!-- 故事 -->
    <section class="stage" id="stage-story">
      <div class="body story-body" id="storyBody" data-choice="yes">
        <div class="panel">
          <span class="q-badge" id="chip"></span>
          <p class="story-text" id="storyText" tabindex="-1"></p>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-gold" id="btnNext" type="button">繼續</button>
      </div>
    </section>

    <!-- 結果 -->
    <section class="stage" id="stage-result">
      <div class="body">
        <div class="panel">
          <span class="q-badge big" id="clearTitle" hidden></span>
          <p class="ending" id="endingText" tabindex="-1"></p>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-gold" id="btnRestart" type="button">重新選擇</button>
      </div>
    </section>

  </main>
</div>

<noscript>這個遊戲需要開啟 JavaScript 才能遊玩。</noscript>

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════
   內容設定：題目、故事、影片都改這裡
   影片：貼上 YouTube 連結即可（一般連結、Shorts、youtu.be 都可以）。
   想只播其中一段，可加 start / end（秒）。
   目前每一題前的影片都是同一支，之後想各題不同，把各題的 url 換掉就好。
   ════════════════════════════════════════════════ */
const VIDEO = { url: 'https://www.youtube.com/shorts/mzCIC-BvVwU' };

const CONFIG = {
  title: '如果那天\n你上了飛機',
  subtitle: '五個選擇，一段練習生到出道的旅程。',
  clearTitle: '恭喜通關',
  ending: '有夢想沒夢想，\n你們都是完整的人。',

  questions: [
    {
      video: VIDEO, // ← Q1 前的影片
      q: '有星探找到你，說想找你去韓國當練習生出道，你會去嗎？',
      yes: '想著免費的機票和沒去過的韓國，雖然沒有關注kpop，但還是想去，於是踏上前往韓國的旅程...',
      no: '雖然有免費機票很心動，自己對當偶像沒興趣，繼續認真讀書考大學。'
    },
    {
      video: VIDEO, // ← Q2 前的影片
      q: '到了小綠屋這裡有好多你不認識的人，有些人甚至感覺特別難相處，你要繼續留在這裡練習嗎？',
      yes: '他們感覺都好有夢想，我繼續跟他們待在這也會這樣嗎？不如試試看吧...',
      no: '他們看起來好累好辛苦，而且不知道訓練多久才可以出道，這是一個沒有未來且黑暗的路，不然回美國吧...'
    },
    {
      video: VIDEO, // ← Q3 前的影片
      q: '你練習好長時間了，真的要跟這群人一起出道嗎？',
      yes: '都辛苦這麼久了，就該出道了對吧',
      no: '我們真的會紅嗎？還是回家過一般人的人生，現在從頭開始也來得及吧'
    },
    {
      video: VIDEO, // ← Q4 前的影片
      q: '你們就這樣一起走了七年，累積了好一批粉絲，你想跟這群人繼續往下走嗎？',
      yes: '我們其實做得還不錯吧，也捨不得成員跟克拉，我們就繼續往下走吧',
      no: '我還有其他事情想做，我選擇離開去其他公司自行發展'
    },
    {
      video: VIDEO, // ← Q5 前的影片
      q: '又來到第二次續約了，你們又走出新高度了，這次也要續約嗎？',
      yes: '廢話！我們當然繼續往下走吧',
      no: '恩..我有自己的規劃了'
    }
  ]
};

/* ════════════════════════════════════════════════
   以下是遊戲邏輯
   ════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const N = CONFIG.questions.length;
const FADE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fade')) || 420;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const stages = {
  start: $('#stage-start'), video: $('#stage-video'), question: $('#stage-question'),
  story: $('#stage-story'), result: $('#stage-result')
};
const el = {
  frame: $('#frame'), trip: $('#trip'), tripLabel: $('#tripLabel'), track: $('#track'),
  railDone: $('#railDone'), plane: $('#plane'),
  qText: $('#qText'), qBadge: $('#qBadge'), answers: $('#answers'), btnYes: $('#btnYes'), btnNo: $('#btnNo'),
  chip: $('#chip'), storyBody: $('#storyBody'), storyText: $('#storyText'),
  clearTitle: $('#clearTitle'), ending: $('#endingText'),
  videoLayer: $('#videoLayer'), videoBar: $('#videoBar'), shield: $('#shield'), videoMsg: $('#videoMsg')
};

let idx = 0;            // 目前第幾題（0 起算）
let lastChoice = null;  // 'yes' | 'no'
let current = null;     // 目前顯示的畫面
let busy = false;       // 換頁動畫中，避免連點
let answering = false;  // 點下 Yes/No 後的短暫停留

/* ---------- 畫面切換：淡出 → 換內容 → 淡入 ---------- */
const TRIP_STAGES = ['video', 'question', 'story'];

async function show(name, prepare) {
  if (busy) return;
  busy = true;
  el.trip.classList.toggle('show', TRIP_STAGES.includes(name));
  el.frame.classList.toggle('mode-video', name === 'video');   // 影片層與舊畫面同時淡入／淡出
  if (current) {
    current.classList.remove('visible');
    await wait(FADE);
    current.classList.remove('active');
  }
  if (prepare) prepare();
  const next = stages[name];
  next.classList.add('active');
  void next.offsetWidth;            // 讓瀏覽器先套用 display，淡入才會有動畫
  next.classList.add('visible');
  current = next;
  const focusTarget = next.querySelector('[tabindex="-1"]');
  if (focusTarget) focusTarget.focus({ preventScroll: true });
  await wait(FADE);
  busy = false;
}

/* ---------- 進度（飛機航線） ---------- */
const stops = [];
function buildTrip() {
  el.track.setAttribute('aria-valuemax', N);
  for (let i = 0; i < N; i++) {
    const s = document.createElement('span');
    s.className = 'stop';
    s.style.left = (N > 1 ? (i / (N - 1)) * 100 : 0) + '%';
    el.track.insertBefore(s, el.plane);
    stops.push(s);
  }
}
function setTrip(i) {
  const pct = N > 1 ? (i / (N - 1)) * 100 : 0;
  el.tripLabel.textContent = `第 ${i + 1} / ${N} 題`;
  el.plane.style.left = pct + '%';
  el.railDone.style.width = pct + '%';
  stops.forEach((s, j) => s.classList.toggle('reached', j <= i));
  el.track.setAttribute('aria-valuenow', i + 1);
}

/* ---------- 流程 ---------- */
function beginQuestion(i) {
  idx = i;
  const q = CONFIG.questions[i];
  if (q.video) {
    // 在玩家「點擊」的同一個動作裡就開始播放，瀏覽器才最可能允許帶聲音自動播放
    prepareVideo(q.video);
    show('video', () => setTrip(i));
  } else {
    show('question', () => { setTrip(i); renderQuestion(i); });
  }
}
function renderQuestion(i) {
  el.qText.textContent = CONFIG.questions[i].q;
  el.qBadge.textContent = 'Q' + (i + 1);
  el.answers.classList.remove('picked');
  el.btnYes.classList.remove('is-picked');
  el.btnNo.classList.remove('is-picked');
}
async function answer(choice) {
  if (busy || answering) return;
  answering = true;
  lastChoice = choice;
  el.answers.classList.add('picked');
  (choice === 'yes' ? el.btnYes : el.btnNo).classList.add('is-picked');
  await wait(280);                                   // 讓玩家看到選中的回饋
  answering = false;
  show('story', () => {
    el.storyBody.dataset.choice = choice;
    el.chip.textContent = '你選了 ' + (choice === 'yes' ? 'Yes' : 'No');
    el.storyText.textContent = CONFIG.questions[idx][choice];
  });
}
function afterStory() {
  if (busy) return;
  const isLast = idx === N - 1;
  if (lastChoice === 'no' || isLast) {
    const cleared = lastChoice === 'yes' && isLast;   // 5 題全部 Yes
    show('result', () => {
      el.clearTitle.hidden = !cleared;
      el.clearTitle.textContent = CONFIG.clearTitle;
      el.ending.textContent = CONFIG.ending;
    });
  } else {
    beginQuestion(idx + 1);
  }
}
function restart() {
  if (busy) return;
  lastChoice = null;
  beginQuestion(0);
}

/* ════════════════════════════════════════════════
   YouTube 影片（自動播放、有聲音、無控制列）
   ════════════════════════════════════════════════ */
let player = null, playerReady = false, apiReady = false, apiFailed = false;
let videoActive = false, currentVideo = null, lastState = -1, playedAt = 0;
let pollTimer = null, guards = [];

function getVideoId(input) {
  if (!input) return null;
  if (/^[\w-]{11}$/.test(input)) return input;
  const m = String(input).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
const isPlaying = () => lastState === 1 || lastState === 3;
const setLoading = (on) => { el.videoLayer.dataset.loading = on ? 'true' : 'false'; };
const setShield = (mode) => { el.shield.dataset.mode = mode; };
function showVideoProblem(msg) {
  setLoading(false);
  el.videoMsg.textContent = msg;
  setShield('msg');
}
function clearGuards() { guards.forEach(clearTimeout); guards = []; }
function stopPoll() { clearInterval(pollTimer); pollTimer = null; }

/* 網頁一載入就先把播放器準備好（隱藏在影片層），玩家點「開始」時才能立刻有聲播放 */
window.onYouTubeIframeAPIReady = () => {
  apiReady = true;
  player = new YT.Player('yt', {
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0,
      modestbranding: 1, playsinline: 1, iv_load_policy: 3, cc_load_policy: 0
    },
    events: {
      onReady: () => { playerReady = true; if (videoActive) loadCurrent(); },
      onStateChange: onPlayerState,
      onAutoplayBlocked: forceMutedPlay,
      onError: () => showVideoProblem('這支影片暫時無法播放，可以按下「略過影片」繼續。')
    }
  });
};
function loadYouTubeApi() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.async = true;
  s.onerror = () => {
    apiFailed = true;
    if (videoActive) showVideoProblem('影片暫時無法載入，可以按下「略過影片」繼續。');
  };
  document.head.appendChild(s);
}

function prepareVideo(cfg) {
  currentVideo = {
    id: getVideoId(cfg.url || cfg.id),
    start: cfg.start || 0,
    end: cfg.end || 0
  };
  videoActive = true;
  lastState = -1;
  playedAt = 0;
  clearGuards();
  stopPoll();
  el.videoBar.style.width = '0%';
  setShield('none');
  setLoading(true);
  if (!currentVideo.id) return showVideoProblem('找不到影片網址，請檢查 CONFIG 裡的 url。');
  if (apiFailed) return showVideoProblem('影片暫時無法載入，可以按下「略過影片」繼續。');
  armGuards();
  if (playerReady) {
    loadCurrent();
  } else {
    guards.push(setTimeout(() => {
      if (videoActive && !playerReady) showVideoProblem('影片載入比較慢，可以再等一下，或按「略過影片」。');
    }, 8000));
  }
}
function loadCurrent() {
  const v = currentVideo;
  const opts = { videoId: v.id, startSeconds: v.start };
  if (v.end) opts.endSeconds = v.end;
  try { player.unMute(); player.setVolume(100); } catch (e) {}
  player.loadVideoById(opts);
}

/* 自動播放被瀏覽器擋住（常見於 iPhone）→ 先靜音播放，再讓玩家點一下開聲音 */
function forceMutedPlay() {
  if (!videoActive || !playerReady) return;
  try { player.mute(); player.playVideo(); } catch (e) {}
}
function armGuards() {
  guards.push(setTimeout(() => { if (videoActive && !isPlaying()) forceMutedPlay(); }, 3000));
  guards.push(setTimeout(() => {
    if (videoActive && !isPlaying()) { setLoading(false); setShield('play'); }
  }, 7000));
}

function onPlayerState(e) {
  lastState = e.data;
  if (!videoActive) return;
  if (e.data === 1) {                       // 播放中
    clearGuards();
    setLoading(false);
    playedAt = Date.now();
    setShield(player.isMuted() ? 'unmute' : 'none');
    startPoll();
  } else if (e.data === 0) {                // 播放結束
    finishVideo();
  }
}
function startPoll() {
  stopPoll();
  pollTimer = setInterval(() => {
    if (!videoActive || !playerReady) return;
    let t = 0, d = 0;
    try { t = player.getCurrentTime(); d = player.getDuration(); } catch (e) { return; }
    const s = currentVideo.start;
    const endAt = currentVideo.end || d;
    if (endAt > s) {
      el.videoBar.style.width = Math.min(100, Math.max(0, ((t - s) / (endAt - s)) * 100)) + '%';
      // 在結尾前一點點就開始淡出，看不到 YouTube 的結尾推薦畫面
      if (Date.now() - playedAt > 1200 && lastState === 1 && t >= endAt - FADE / 1000 - 0.1) finishVideo();
    }
  }, 150);
}

/* 影片播完或按「略過影片」→ 淡出，進入問題 */
function finishVideo() {
  if (!videoActive) return;
  if (busy) { setTimeout(finishVideo, 150); return; }
  videoActive = false;
  stopPoll();
  clearGuards();
  show('question', () => {
    try { if (player && playerReady) player.pauseVideo(); } catch (e) {}   // 淡出結束後才停，聲音不會突然被切掉
    renderQuestion(idx);
  });
}

/* ---------- 綁定事件 ---------- */
$('#btnStart').addEventListener('click', () => { if (!busy) beginQuestion(0); });
$('#btnSkip').addEventListener('click', finishVideo);
$('#btnYes').addEventListener('click', () => answer('yes'));
$('#btnNo').addEventListener('click', () => answer('no'));
$('#btnNext').addEventListener('click', afterStory);
$('#btnRestart').addEventListener('click', restart);
$('#playBtn').addEventListener('click', () => {
  try { player.unMute(); player.setVolume(100); player.playVideo(); } catch (e) {}
  setShield('none');
  setLoading(true);
});
$('#unmuteBtn').addEventListener('click', () => {
  try { player.unMute(); player.setVolume(100); } catch (e) {}
  setShield('none');
});

/* ---------- 啟動 ---------- */
$('#startTitle').textContent = CONFIG.title;
$('#startLede').textContent = CONFIG.subtitle;
buildTrip();
loadYouTubeApi();
show('start');
})();
</script>
</body>
</html>
